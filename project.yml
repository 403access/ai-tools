name: OpenCodeBarMobile
options:
  bundleIdPrefix: dev.opencodebar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    # After v1.5.1 (no stray debug print) and before the Metal resource was
    # added; see Package.swift for why this revision is pinned.
    revision: 493d99e4e3e99a27077bf24bc0e1c8d20f9f7925

targets:
  OpenCodeBarMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/OpenCodeBarMobile
      - path: Sources/OpenCodeBar/Models
      - path: Sources/OpenCodeBar/Core/HubAPI.swift
      - path: Sources/OpenCodeBar/Core/HubAPI+Endpoints.swift
      - path: Sources/OpenCodeBar/Core/HubAPI+Transport.swift
      - path: Sources/OpenCodeBar/Core/HubModels.swift
      - path: Sources/OpenCodeBar/Core/HubEventStream.swift
      - path: Sources/OpenCodeBar/Core/DeviceIdentity.swift
      - path: Sources/OpenCodeBar/Core/HubConfig.swift
      - path: Sources/OpenCodeBar/Core/WidgetShared.swift
      - path: Sources/OpenCodeBar/Core/TerminalConnection.swift
      - path: Sources/OpenCodeBar/Support/Formatters.swift
      - path: Sources/OpenCodeBar/Support/SpeechInput.swift
      - path: Sources/OpenCodeBar/Views/Theme.swift
      - path: Sources/OpenCodeBar/Views/Components.swift
      - path: Sources/OpenCodeBar/Views/PerformanceViews.swift
      - path: Sources/OpenCodeBar/Views/HeatmapView.swift
      - path: Sources/OpenCodeBar/Views/LiveActivityView.swift
      - path: Sources/OpenCodeBar/Views/TerminalEmulatorView.swift
      - path: Mobile/Assets.xcassets
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - sdk: libsqlite3.tbd
      - target: OpenCodeBarWidgets
      - package: SwiftTerm
    entitlements:
      path: Mobile/OpenCodeBar.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.opencodebar.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.opencodebar.mobile
        PRODUCT_NAME: OpenCodeBar
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    info:
      path: Mobile/Info.plist
      properties:
        CFBundleDisplayName: OpenCodeBar
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        OpenCodeBarSharedKeychainGroup: $(AppIdentifierPrefix)dev.opencodebar.shared
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: OpenCodeBar connects to the hub running on your Mac to show live OpenCode sessions.
        NSCameraUsageDescription: OpenCodeBar uses the camera to scan the pairing QR code shown on your Mac.
        NSMicrophoneUsageDescription: OpenCodeBar uses the microphone to dictate prompts into a session.
        NSSpeechRecognitionUsageDescription: OpenCodeBar turns your spoken prompt into text, on the device when the language supports it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.opencodebar.mobile
            CFBundleURLSchemes:
              - opencodebar

  OpenCodeBarWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/OpenCodeBarWidgets
      - path: Sources/OpenCodeBar/Models
      - path: Sources/OpenCodeBar/Core/HubAPI.swift
      - path: Sources/OpenCodeBar/Core/HubAPI+Endpoints.swift
      - path: Sources/OpenCodeBar/Core/HubAPI+Transport.swift
      - path: Sources/OpenCodeBar/Core/HubModels.swift
      - path: Sources/OpenCodeBar/Core/DeviceIdentity.swift
      - path: Sources/OpenCodeBar/Core/HubConfig.swift
      - path: Sources/OpenCodeBar/Core/WidgetShared.swift
      - path: Sources/OpenCodeBar/Support/Formatters.swift
      - path: Sources/OpenCodeBar/Views/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.opencodebar.mobile.widgets
        PRODUCT_NAME: OpenCodeBarWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_PREVIEWS: YES
    entitlements:
      path: Mobile/OpenCodeBarWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.opencodebar.shared
    info:
      path: Mobile/Widgets-Info.plist
      properties:
        CFBundleDisplayName: OpenCodeBar
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        OpenCodeBarSharedKeychainGroup: $(AppIdentifierPrefix)dev.opencodebar.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSLocalNetworkUsageDescription: OpenCodeBar widgets connect to the hub on your Mac to refresh live sessions and usage.
